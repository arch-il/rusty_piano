[package]
name = "rusty_piano_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
hound = "3.5.1"
midir = "0.11.1"
ron = "0.12.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
tungstenite = "0.30.0"
wasapi = "0.26.0"

[features]
# ASIO is on by default; build without it with --no-default-features.
default = ["asio"]
# ASIO (FlexASIO) backend. Needs libclang and downloads the Steinberg ASIO SDK at build time.
asio = ["cpal/asio"]
