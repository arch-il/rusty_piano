[project]
name = "rusty-piano-coach"
version = "0.1.0"
description = "Practice coach for rusty_piano: sheet music library (download, store, search MusicXML); session analysis and reports come later."
requires-python = ">=3.12"
dependencies = [
    "music21>=10.5.2",
    "pianoplayer>=3.0.2",
]

[project.scripts]
coach = "rusty_piano_coach.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
# Pinned to the uv minor version that created the project (uv 0.11.21 is installed here), with an upper bound as uv recommends because the build backend may change between minor versions.
# A newer uv still builds with this pinned backend (it fetches the matching uv_build), so bump both bounds only when moving the project to uv 0.12.
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
